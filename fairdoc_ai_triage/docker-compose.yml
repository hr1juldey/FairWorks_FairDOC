# version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fairdoc-postgres
    environment:
      POSTGRES_DB: fairdoc_ai
      POSTGRES_USER: fairdoc_user
      POSTGRES_PASSWORD: fairdoc_secure_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairdoc_user -d fairdoc_ai"]
      interval: 30s
      timeout: 10s
      retries: 6
    networks:
      - fairdoc-network
    restart: unless-stopped

  # Redis for caching and sessions  
  redis:
    image: redis:7-alpine
    container_name: fairdoc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis_fairdoc_pass
    healthcheck:
      test: ["CMD", "redis-cli", "auth", "redis_fairdoc_pass", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fairdoc-network
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: fairdoc-minio
    environment:
      MINIO_ROOT_USER: fairdoc_minio
      MINIO_ROOT_PASSWORD: fairdoc_minio_secure_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - fairdoc-network
    restart: unless-stopped

  # Optional: Celery Worker (can also be run locally)
  # celery:
  #   image: redis:7-alpine  # Lightweight container for worker
  #   container_name: fairdoc-celery-placeholder
  #   command: ["redis-cli", "--version"]  # Placeholder command
  #   depends_on:
  #     - redis
  #   networks:
  #     - fairdoc-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  fairdoc-network:
    driver: bridge
